[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-catgirl-lora"
version = "0.1.0"
description = "QLoRA fine-tuning and Gradio chat for Qwen2.5 catgirl persona"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "qwen-catgirl-lora contributors" }]
keywords = ["qlora", "lora", "qwen", "gradio", "peft"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.0.0",
    "bitsandbytes>=0.43.0",
    "datasets>=3.0.0",
    "gradio>=5.0.0",
    "matplotlib>=3.8.0",
    "modelscope>=1.20.0",
    "numpy>=1.26.0",
    "peft>=0.12.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
qcl-train = "qwen_catgirl_lora.cli:train_app"
qcl-serve = "qwen_catgirl_lora.cli:serve_app"
qcl-plot-loss = "qwen_catgirl_lora.cli:plot_loss_app"
qcl-download = "qwen_catgirl_lora.cli:download_app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
